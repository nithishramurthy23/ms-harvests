# Runs the full stack: MySQL, several backend copies, and nginx (frontend + load balancer).
#   cp .env.example .env   # fill in values
#   docker compose up -d --build
#   open http://localhost:8081
# More backend copies: BACKEND_REPLICAS=4 docker compose up -d

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: farm_fresh
    volumes:
      - mysql-data:/var/lib/mysql
      - ./Untitled.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/farm_fresh?serverTimezone=UTC
      DB_USERNAME: root
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mysql-data:
