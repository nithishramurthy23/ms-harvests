# Secrets come from environment variables. See .env.example for the full list.
# A local .env file in the folder you start the app from is loaded automatically.
spring.config.import=optional:file:.env[.properties]
spring.application.name=farm-fresh

# Server port (different from React's default 3000)
server.port=${PORT:8080}

# Frontend origins allowed by CORS (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# MAIL CONFIG
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# DB CONFIG
# Force JDBC to UTC
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farm_fresh?serverTimezone=UTC}

# Make Hibernate always store & retrieve in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Logging
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# JWT CONFIG
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000} 
# RESILIENCE
# Finish in-flight requests before shutting down (rolling restarts lose nothing)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Health checks for Docker / load balancer: /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# Fail fast instead of hanging when the database or mail server is slow
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Background email threads
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=500
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=20s
