# Docker's internal DNS; re-resolve backend copies as they come and go
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    zone backend 64k;
    least_conn;
    # "backend" resolves to every running backend copy
    server backend:8080 resolve max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 1s;
        proxy_read_timeout 30s;
        # If a copy is down, retry on another one. POSTs (like placing an order)
        # are never retried, so an order can't be placed twice.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # Single-page app: unknown paths go to index.html
    location / {
        try_files $uri /index.html;
    }
}
